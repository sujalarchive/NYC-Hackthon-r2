<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap"rel="stylesheet"
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="theme-colour" content="#000000">
   <meta name="Description" content="A minimal to-do List Website">
   <title>To Do List</title>
   <link rel="stylesheet" href="style.css">
</head>

    <body class="default-theme">
        <!--theme buttons-->
        <button class="theme-selector" id="theme-toggle">
            Toggle Theme     
        </button>
        <!--header-->
    <div id ="header">

        <div class="flex-container">
            <div class="default-theme theme-selector"></div>
            <div class="dark-theme theme-selector"></div>
        <div class="light-theme theme-selector"></div>
        </div>

        <h1 id ="title">To Do list</h1>

    </div>
    <!--form-->
    <div id="form">
        <form>

            <input
            type="text"
             class="todo-input"
             placeholder="Add a new task...">

             <button type="submit">Add Task</button>

        </form>
    </div>
    <!--github icon -->
    <div class ="version">
        <div class="demo version">
            <a href="https://github.com/sujalarchive/NYC-Hackthon-r2" class="github">

                <!-- GitHub SVG Icon -->
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                ... (truncated for brevity) ...
                </svg>
             </a>

            </div>
    </div>
                <!-- Date and Time -->
                 <div>
                <p><span id="datetime"></span></p>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
            </div>
<!-- To Do List -->
                <div id="todo-list">

                    <ul class="todo-list">
                        <!--JavaScript will dynamically add list items here-->
                    </ul>
                    </div>  

                        <button>Delete</button>

                        <button>Complete</button>

    <!-- JavaScript -->
                    <script
                     src="script.js" type="text/javascript"></script>

</body>
</html>
